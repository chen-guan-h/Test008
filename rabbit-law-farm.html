<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5e8f62">
<title>兔子農場行政法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--grass:#6fa84a;--leaf:#3f7a45;--hay:#e2c45a;--wood:#a8784a;--paper:#fbf7ee;--card:#fffdf8;--ink:#2b2622;--mute:#7a7064;--line:rgba(43,38,34,.13);--red:#c8402a;--blue:#3d6e8c;--ok:#3f8a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2a20;color:var(--ink);font-family:"Huninn","Noto Sans TC",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#cv,#ov{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#ov{z-index:2;touch-action:none}
#nogl{position:fixed;left:16px;right:16px;top:40%;z-index:3;background:#fff;border-radius:14px;padding:14px;text-align:center}
#card{position:fixed;left:8px;right:8px;z-index:7;max-width:460px;margin:0 auto;background:rgba(255,253,248,.97);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.28);padding:10px 12px;font-size:13.5px;animation:fin .2s}
#card .x{width:28px;height:28px;border-radius:14px;background:#ece5d4}
#card .cname{font-size:17px;cursor:pointer}
.qrow{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.coin{position:fixed;left:50%;transform:translateX(-50%);z-index:20;font:900 26px "Huninn",sans-serif;color:#ffd23a;text-shadow:0 2px 0 #8a5a10,0 0 8px rgba(0,0,0,.4);pointer-events:none;animation:coin 1.4s ease-out forwards}
@keyframes coin{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-70px}}
#cLv{flex-direction:column;align-items:stretch;gap:2px;padding:3px 9px}
#cLv .lvb{height:4px;border-radius:2px;background:#e6dfcf;overflow:hidden;width:56px}#cLv .lvb i{display:block;height:100%;background:#e2a83a}
.bunny b{font-size:14px}
#top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(6px + env(safe-area-inset-top)) 8px 4px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:rgba(255,253,248,.94);border-radius:13px;padding:4px 9px;font-size:12.5px;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;gap:5px;white-space:nowrap}
.chip b{font-size:14px}
#cMoney b{color:#2f6b2f;font-size:15px}
#cDate{flex-direction:column;align-items:flex-start;gap:0;line-height:1.15;padding:3px 10px}
#cDate small{color:var(--mute);font-size:10.5px}
#speed{padding:2px;gap:1px}
#speed button{width:30px;height:26px;border-radius:8px;font-size:12px;color:var(--mute);font-weight:700}
#speed button.on{background:var(--leaf);color:#fff}
.warn{color:var(--red)!important}
#feed{position:fixed;left:8px;z-index:4;top:96px;width:min(340px,calc(100vw - 16px));display:flex;flex-direction:column;gap:4px;pointer-events:none}
.fd{background:rgba(255,253,248,.93);border-left:4px solid var(--blue);border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.35;box-shadow:0 1px 4px rgba(0,0,0,.12);animation:fin .25s;transition:opacity .6s}
.fd.good{border-color:var(--ok)}.fd.bad{border-color:var(--red)}.fd.big{border-color:var(--hay);font-weight:700}
@keyframes fin{from{transform:translateX(-10px);opacity:0}}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom);background:var(--paper);box-shadow:0 -4px 14px rgba(0,0,0,.18);border-radius:16px 16px 0 0}
#sheet{max-height:min(48vh,440px);overflow-y:auto;padding:10px 12px 12px;font-size:14px;-webkit-overflow-scrolling:touch}
#bottom.quiz #sheet{max-height:min(66vh,620px)}
#bottom.min #sheet{display:none}
#tabs{display:flex;border-top:1px solid var(--line)}
#tabs button{flex:1;padding:6px 0 5px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#tabs i{font-style:normal;font-size:18px;line-height:1.1}
#tabs button.on{color:var(--leaf);font-weight:700;background:#eef3e4}
#tabs .dot{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
#grip{display:flex;justify-content:center;padding:5px 0 0;cursor:pointer}
#grip span{width:42px;height:5px;border-radius:3px;background:#d8d0c0}
h3{margin:2px 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3 small{font-weight:400;color:var(--mute);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px}
.card.tap{cursor:pointer}.card.tap:active{background:#f3eedf}
.card.lock{opacity:.55}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.desc{font-size:12px;color:var(--mute);line-height:1.5;margin-top:3px}
.meter{height:8px;border-radius:4px;background:#e6dfcf;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--grass)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:#e8eef2;color:var(--blue);margin:2px 4px 0 0;white-space:nowrap}
.tag.g{background:#e2eed6;color:#3f6a2a}.tag.r{background:#f7dcd5;color:var(--red)}.tag.y{background:#f8edc8;color:#8a6a10}
.btn{background:var(--leaf);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700}
.btn.s{padding:5px 9px;font-size:12px}.btn.alt{background:#e6dfcf;color:var(--ink)}.btn.red{background:var(--red)}.btn.gold{background:var(--hay);color:var(--ink)}.btn.blue{background:var(--blue)}
.btn:disabled{opacity:.4}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv span{color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px}
.stat b{display:block;font-size:17px}
/* 答題 */
.qhead{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
.qtext{font-size:16px;line-height:1.65;margin:4px 0 10px;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;font-size:14.5px;line-height:1.5}
.opt .k{flex:none;width:24px;height:24px;border-radius:12px;background:#ece5d4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt.ok{border-color:var(--ok);background:#eaf5e2}.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--red);background:#fbe9e4}.opt.no .k{background:var(--red);color:#fff}
.opt.pick{border-color:var(--blue);background:#e9f1f6}.opt.pick .k{background:var(--blue);color:#fff}
.exp{background:#fff8e2;border:1px solid #ecd9a0;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.65;margin:4px 0 8px}
.exp b.v{font-size:15px}
.law{display:inline-block;background:var(--blue);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;margin-right:4px}
.qfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.note{font-size:13.5px;line-height:1.7;padding:7px 0;border-bottom:1px dashed var(--line)}
.ach{display:flex;gap:8px;align-items:center}
.ach i{font-style:normal;font-size:22px}
.ach.off{opacity:.4;filter:grayscale(1)}
.log{font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.log.bad{color:#9a2a1a}.log.good{color:#3a6a1a}.log.big{font-weight:700}
.ov{position:fixed;inset:0;z-index:30;background:rgba(20,30,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--paper);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.box h2{margin:0 0 8px;font-size:21px}
.box p{line-height:1.7;margin:0 0 10px;font-size:14.5px}
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(180deg,#86c2ea 0%,#d9f0fb 50%,#8cc65a 51%,#5e8f42 100%)}
#title .box{text-align:center;background:rgba(251,247,238,.96)}
#title h1{margin:6px 0 4px;font-size:28px;color:var(--leaf);letter-spacing:1px}
#title input{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);width:100%;max-width:260px;text-align:center;margin:6px 0 10px}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:50;background:rgba(43,38,34,.9);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;pointer-events:none;transition:opacity .3s;text-align:center;max-width:80vw}
.bigscore{font-size:30px;font-weight:900}
.timer{font-variant-numeric:tabular-nums}
@media(max-width:520px){.chip{font-size:11.5px;padding:3px 7px}.chip b{font-size:13px}#speed button{width:26px}.qtext{font-size:15px}.opt{font-size:14px;padding:9px 10px}}
</style>
</head>
<body>
<canvas id="cv"></canvas><canvas id="ov"></canvas><div id="nogl" hidden>你的瀏覽器不支援 3D（WebGL），請改用最新版 Chrome 或 Safari。答題與農場功能仍可使用。</div><div id="card" hidden></div>
<div id="top" hidden>
  <div class="chip" id="cLv"><span>⭐ Lv <b id="lv">1</b></span><div class="lvb"><i id="lvBar"></i></div></div>
  <div class="chip" id="cMoney">💰 <b id="money">0</b></div>
  <div class="chip" id="cDate"><b id="clock">06:00</b><small id="date"></small></div>
  <div class="chip" id="cWx"></div>
  <div class="chip" id="cRab">🐰 <b id="rab">0</b></div>
  <div class="chip" id="cDog">🐶 <b id="dog">0</b></div>
  <div class="chip" id="cHay">🌾 <b id="hay">0</b></div>
  <div class="chip" id="cPel">🥕 <b id="pel">0</b></div>
  <div class="chip" id="speed"><button data-s="0">❚❚</button><button data-s="1" class="on">▶</button><button data-s="2">▶▶</button></div>
</div>
<div id="feed"></div>
<div id="bottom" hidden>
  <div id="grip"><span></span></div>
  <div id="sheet"></div>
  <div id="tabs">
    <button data-t="work" class="on"><i>💼</i>工作</button>
    <button data-t="farm"><i>🏡</i>農場<span class="dot" id="fDot" hidden></span></button>
    <button data-t="bunny"><i>🐰</i>兔子</button>
    <button data-t="shop"><i>🛒</i>商店</button>
    <button data-t="note"><i>📖</i>筆記</button>
    <button data-t="wrong"><i>📕</i>錯題<span class="dot" id="wDot" hidden></span></button>
    <button data-t="me"><i>🏆</i>成就</button>
  </div>
</div>
<div class="ov" id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="title"><div class="box" id="tbox"></div></div>
<div id="toast" style="opacity:0"></div>
<script>
/* 題庫 1／2：行政程序法 第一章（總則）各節
   格式：[難度 1~3, 題目, 正確選項, [錯誤選項×3], 解析, 法條]
   選項於出題時隨機排列。 */
(function () {
'use strict';
const CH = window.CH = window.CH || [];

CH.push({
  id: 'c1', n: '法例與一般原則', law: '行政程序法 §1–§10',
  notes: [
    '§1 立法目的：使行政行為遵循「公正、公開與民主」之程序，確保依法行政之原則，以保障人民權益，提高行政效能，增進人民對行政之信賴。',
    '§2 行政程序：作成行政處分、締結行政契約、訂定法規命令與行政規則、確定行政計畫、實施行政指導及處理陳情等行為之程序。',
    '§2 行政機關：代表國家、地方自治團體或其他行政主體表示意思，從事公共事務，具有「單獨法定地位」之組織；受託行使公權力之個人或團體，於委託範圍內「視為行政機關」。',
    '§3 不適用之機關：各級民意機關、司法機關、監察機關。',
    '§3 不適用之事項：外交軍事國安、外國人出入境／難民認定／國籍變更、刑事犯罪偵查、犯罪矯正收容、私權爭執之行政裁決、學校教育內部程序、對公務員之人事行政行為、考試院考選命題及評分。',
    '§4 依法行政：受法律及一般法律原則之拘束。法律優位（消極：不得牴觸法律）＋法律保留（積極：須有法律或法律明確授權之命令為依據）。',
    '§5 明確性原則（可理解、可預見、可審查）；§6 平等原則（非有正當理由不得差別待遇）。',
    '§7 比例原則：①適當性（有助目的達成）②必要性（最小侵害）③狹義比例／衡量性（損害不得與利益顯失均衡）。',
    '§8 誠實信用＋信賴保護：信賴基礎、信賴表現、信賴值得保護。§9 有利不利一律注意。',
    '§10 裁量：不得逾越法定之裁量範圍（裁量逾越），並應符合法規授權之目的（否則裁量濫用）；應裁量而未裁量為裁量怠惰。',
    '釋字第443號「層級化法律保留」：剝奪生命、限制人身自由→須以法律規定（絕對法律保留）；其他自由權利限制→法律或具體明確授權之命令；執行法律之細節性、技術性次要事項→得以命令定之；給付行政規範密度較寬鬆，但涉及公共利益重大事項仍應有法律或法律授權之命令為依據。',
  ],
  qs: [
    [1, '依行政程序法第1條，下列何者「不是」本法明定之立法目的？', '促進國家經濟發展', ['確保依法行政之原則', '保障人民權益', '增進人民對行政之信賴'], '§1：使行政行為遵循公正、公開與民主之程序，確保依法行政之原則，以保障人民權益，提高行政效能，增進人民對行政之信賴。並無「促進經濟發展」。', '§1'],
    [1, '依行政程序法第2條，下列何種行為之程序「不屬於」該法所稱之行政程序？', '對義務人之財產實施強制執行', ['締結行政契約', '實施行政指導', '處理陳情'], '§2 所列行政程序：行政處分、行政契約、法規命令與行政規則、行政計畫、行政指導、陳情。強制執行另依行政執行法。', '§2 I'],
    [1, '受託行使公權力之個人或團體，於委託範圍內，在行政程序法上之地位為何？', '視為行政機關', ['視為當事人', '視為行政機關之輔助人，不具機關地位', '視為利害關係人'], '§2 III：受託行使公權力之個人或團體，於委託範圍內，視為行政機關。', '§2 III'],
    [1, '依行政程序法第3條，下列何者之行政行為「不適用」本法之程序規定？', '各級民意機關', ['行政院', '縣（市）政府', '鄉（鎮、市）公所'], '§3 II：各級民意機關、司法機關、監察機關之行政行為，不適用本法程序規定。', '§3 II'],
    [2, '下列何種事項，依行政程序法第3條第3項「不適用」本法之程序規定？', '考試院有關考選命題及評分之行為', ['環保局對污染業者裁處罰鍰', '縣政府核發建造執照', '稅捐稽徵機關核定稅額'], '§3 III ⑧：考試院有關考選命題及評分之行為，不適用本法程序規定。其餘選項皆為一般行政處分，適用本法。', '§3 III'],
    [2, '下列何者「不屬於」行政程序法第3條第3項排除適用之事項？', '縣政府對違規廣告物所為之罰鍰處分', ['外國人出、入境、難民認定及國籍變更之行為', '刑事案件犯罪偵查程序', '學校為達成教育目的之內部程序'], '§3 III 排除：外交軍事國安、外國人出入境等、刑事偵查、犯罪矯正、私權爭執之行政裁決、學校教育內部程序、公務員人事行政行為、考選命題評分。違規罰鍰為一般行政處分。', '§3 III'],
    [1, '依行政程序法第4條，行政行為應受何者之拘束？', '法律及一般法律原則', ['僅受法律之拘束', '僅受上級機關命令之拘束', '僅受憲法之拘束'], '§4：行政行為應受法律及一般法律原則之拘束。', '§4'],
    [1, '「行政行為不得牴觸法律，牴觸者無效」所指的是下列何種原則？', '法律優位原則（消極依法行政）', ['法律保留原則（積極依法行政）', '比例原則', '誠實信用原則'], '法律優位：一切行政行為不得違反現行有效之法律，又稱消極的依法行政。', '§4'],
    [1, '行政機關限制人民權利，必須有法律或法律明確授權之法規命令作為依據，稱為何種原則？', '法律保留原則', ['法律優位原則', '平等原則', '明確性原則'], '法律保留：特定事項須有法律（或法律明確授權之命令）依據，行政機關才能作為，又稱積極的依法行政。', '§4'],
    [1, '依行政程序法第5條，行政行為之內容應具備何種要求？', '應明確', ['應公開', '應經聽證', '應經上級核定'], '§5：行政行為之內容應明確（可理解、可預見、可審查）。', '§5'],

/* ---------- 毛色與品種 ---------- */
const COMMON = ['white', 'cream', 'fawn', 'brown', 'chestnut', 'gray', 'black', 'orange'], RARE = ['gold', 'blue', 'lilac', 'choco'];
F.randCoat = function (rare) {
  const c1 = Math.random() < (rare ? 0.6 : 0.08) ? U.pick(RARE) : U.pick(COMMON);
  const pat = U.pick(rare ? ['solid', 'dutch', 'spot', 'himalayan', 'agouti'] : ['solid', 'solid', 'solid', 'dutch', 'agouti', 'spot']);
  const br = rare ? U.pick(['lop', 'dwarf', 'lion']) : Math.random() < 0.05 ? U.pick(['lop', 'dwarf']) : 'std';
  return { c1: pat === 'himalayan' ? 'white' : c1, c2: 'white', pat, br };
};
F.inherit = function (mom, dad) {
  if (Math.random() < 0.1) return F.randCoat(Math.random() < 0.25);
  const a = Math.random() < 0.5 ? mom.coat : (dad || mom).coat, b = Math.random() < 0.5 ? mom.coat : (dad || mom).coat;
  return { c1: a.c1, c2: 'white', pat: b.pat, br: Math.random() < 0.5 ? a.br : b.br };
};
F.coatKey = c => `${c.br}-${c.pat}-${c.c1}`;
F.rarity = c => (RARE.includes(c.c1) ? 2 : 0) + (c.br !== 'std' ? 2 : 0) + (c.pat === 'himalayan' || c.pat === 'spot' ? 1 : 0);
F.coatName = function (c) { const CN = { white: '白', cream: '奶油', fawn: '淺棕', brown: '棕', chestnut: '栗', gray: '灰', black: '黑', orange: '橘', gold: '金', blue: '藍灰', lilac: '丁香紫', choco: '巧克力' }; const PN = { solid: '', dutch: '荷蘭斑', spot: '花斑', himalayan: '喜馬拉雅', agouti: '野兔色' }; const BN = { std: '', lop: '垂耳', dwarf: '侏儒', lion: '獅子' }; return `${CN[c.c1] || ''}${PN[c.pat] ? '・' + PN[c.pat] : ''}${BN[c.br] ? '・' + BN[c.br] + '兔' : ''}`; };

/* ---------- 新遊戲 ---------- */

  stats: { born: 0, sold: 0, soldMoney: 0, attacks: 0, repel: 0, dogLost: 0, dogHurt: 0, doorsBroken: 0, sAttack: 0, sWin: 0, maxRabbits: 2, spent: 0, pets: 0, gifts: 0, giftMoney: 0 },
  quiz: { s: {}, right: 0, wrong: 0, streak: 0, best: 0, earned: 0, unlocked: ['c1'], exams: [], recent: [] },
  ach: {}, seenIntro: 0, seenV2: 1, quality: 2,
});
F.newGame = function (name) {

  Object.assign(G, F.blank(), { name: name || '縱谷兔子農場' });
  F.addRabbit('m', 12, null, false, 'curious'); F.addRabbit('f', 12, null, false, 'clingy');

  F.log(`${G.name}開張了！先去「💼 工作」答題賺錢，再幫兔子買擺設吧。`, 'big');
};
F.uniqName = function () { const used = new Set(G.rabbits.map(r => r.nm)); const free = F.NAMES.filter(n => !used.has(n)); return free.length ? U.pick(free) : U.pick(F.NAMES) + (G.nid % 100); };
F.addRabbit = function (s, age, mom, rare, pers) {
  const dad = mom ? U.pick(F.adults('m')) : null;
  const coat = mom ? F.inherit(mom, dad) : F.randCoat(rare);
  const r = { id: G.nid++, s, age: age || 0, hp: 100, full: 80, preg: 0, nurse: 0, sick: 0, mood: 65, aff: mom ? 15 : 5, pers: pers || U.pick(Object.keys(F.PERS)), coat, nm: F.uniqName(), care: {}, born: G.day };
  G.rabbits.push(r);
  const key = F.coatKey(coat);
  if (!G.album[key]) { G.album[key] = G.day + 1; if (Object.keys(G.album).length > 2) F.log(`📔 圖鑑新增：${F.coatName(coat)}！`, 'good'); }
  emit({ k: 'rabbitAdd', id: r.id });
  return r;
};
F.addDog = function () { const d = { id: G.nid++, nm: U.pick(F.DOGNAMES.filter(n => !G.dogs.some(x => x.nm === n))) || '小狗', ci: G.dogs.length % 6, hp: 100, atk: U.ri(11, 14), lv: 1, xp: 0, hungry: 0, wins: 0, aff: 10, care: {} }; G.dogs.push(d); F.log(`看門狗「${d.nm}」加入農場，在庭院巡邏中！`, 'good'); emit({ k: 'dogAdd', id: d.id }); return d; };
F.log = function (m, kind) { G.log.push({ d: G.day, t: G.min, m, kind }); if (G.log.length > 150) G.log.shift(); emit({ k: 'log', m, kind }); };

/* ---------- 曆法 ---------- */
F.season = (d = G.day) => Math.floor((d % F.YEAR_DAYS) / F.SEASON_DAYS);
F.dateStr = () => `第 ${Math.floor(G.day / F.YEAR_DAYS) + 1} 年 ${F.SEASONS[F.season()]}季 第 ${G.day % F.SEASON_DAYS + 1} 天`;
F.isNight = (m = G.min) => m >= 19 * 60 || m < 5 * 60;
F.fullMoon = (d = G.day) => d % 14 === 13;
F.cap = () => G.doors.reduce((s, d) => s + (d ? F.HUTCH_CAP : 5), 0);
F.adults = s => G.rabbits.filter(r => r.age >= F.ADULT && (!s || r.s === s));

/* ---------- 時間推進 ---------- */
F.tick = function (mins) {
  for (let i = 0; i < mins && !F.hold; i++) {
    const h0 = Math.floor(G.min / 60);
    G.min++;
    if (G.min >= 1440) { G.min = 0; F.newDay(); }
    const h1 = Math.floor(G.min / 60);
    if (h1 !== h0) F.hour(h1);
  }
};
F.dailyNeed = function () {
  const k0 = F.season() === 3 ? 1.25 : 1, k1 = G.weather === '寒流' ? 1.15 : 1;
  let hay = 0, pel = 0;
  for (const r of G.rabbits) { if (r.age < 3) continue; const k = r.age < F.ADULT ? 0.5 : 1; hay += 0.25 * k * (r.pers === 'glutton' ? 1.15 : 1); pel += 0.12 * k * (r.nurse || r.preg ? 1.6 : 1); }
  return { hay: hay * k0 * k1, pel: pel * k0 * k1 };
};
F.hour = function (h) {
  const need = F.dailyNeed(), hn = need.hay / 24, pn = need.pel / 24;
  const hayOk = G.hay >= hn, pelOk = G.pel >= pn;
  G.hay = Math.max(0, G.hay - hn); G.pel = Math.max(0, G.pel - pn);
  if (!hayOk && !G.hayShort) { G.hayShort = 1; F.log('牧草吃完了！兔子會餓、心情變差，快去商店買。', 'bad'); emit({ k: 'alert', m: '🌾 牧草用完了' }); }
  if (!pelOk && !G.pelShort) { G.pelShort = 1; F.log('兔飼料吃完了，母兔不會懷孕、小兔長不好。', 'bad'); }
  if (hayOk) G.hayShort = 0; if (pelOk) G.pelShort = 0;
  for (const r of G.rabbits) {
    if (r.age < 3) { r.full = 90; continue; }
    r.full = U.clamp(r.full + (hayOk && pelOk ? 6 : hayOk || pelOk ? -1.5 : -5), 0, 100);
    if (r.full < 25) { r.hp = Math.max(15, r.hp - 1.2); r.mood = Math.max(0, r.mood - 0.8); }
    else if (!r.sick) r.hp = Math.min(100, r.hp + 0.5);
  }
  if (h === G.wolfHour) F.raid();
  if (h === G.eagle) F.eagleScare();
};
F.planDay = function () {
  const s = F.season(), d = G.day, r = Math.random();
  G.weather = s === 0 ? (r < 0.6 ? '晴' : r < 0.9 ? '雨' : '陰') : s === 1 ? (r < 0.6 ? '晴' : r < 0.85 ? '雨' : r < 0.95 ? '陰' : '颱風') : s === 2 ? (r < 0.65 ? '晴' : r < 0.85 ? '陰' : '雨') : (r < 0.45 ? '晴' : r < 0.7 ? '陰' : r < 0.9 ? '寒流' : '雨');
  if (G.weather === '颱風') { G.clean = Math.max(0, G.clean - 30); F.log('颱風來襲！兔舍被吹得亂七八糟。', 'bad'); emit({ k: 'alert', m: '🌀 颱風來襲' }); }
  const n = G.rabbits.length;
  let p = d < 4 ? 0 : 0.18 + Math.min(0.18, d * 0.004) + Math.min(0.2, n / 160);
  p *= [0.9, 1, 1.15, 1.35][s] * F.FENCE[G.fence].mul * (G.weather === '雨' || G.weather === '颱風' ? 0.75 : 1);
  const sChance = d >= 14 ? (F.fullMoon() ? 0.4 : 0.05) : 0;
  G.wolfS = Math.random() < sChance ? 1 : 0;
  if (G.wolfS) p = Math.max(p, F.fullMoon() ? 0.85 : 0.5);
  G.wolfHour = Math.random() < p ? U.pick([20, 21, 22, 23, 0, 1, 2, 3]) : -1;
  G.eagle = !G.net && Math.random() < 0.1 ? U.ri(9, 16) : -1;
};
F.newDay = function () {
  G.day++;
  const s = F.season();
  if (G.day % F.SEASON_DAYS === 0) F.log(`${F.SEASONS[s]}天到了。${['春天是繁殖旺季！', '夏天注意颱風。', '秋天野狼為了過冬開始活躍。', '冬天食量大增，野狼最兇。'][s]}`, 'big');
  if (F.fullMoon()) F.log('🌕 今晚是滿月……聽說森林深處的狼人會出沒。', 'bad');
  /* 年齡、懷孕、哺乳 */
  const births = [];
  for (const r of G.rabbits) { r.age++; if (r.nurse) r.nurse--; if (r.preg) { r.preg--; if (!r.preg) births.push(r); } r.care = {}; }
  for (const m of births) {
    let litter = U.ri(2, 6); if (m.mood < 40 || m.full < 40) litter = Math.max(1, litter - 2);
    litter = Math.min(litter, Math.max(1, F.cap() + 4 - G.rabbits.length));
    for (let i = 0; i < litter; i++) F.addRabbit(Math.random() < 0.5 ? 'm' : 'f', 0, m);
    m.nurse = F.NURSE; G.stats.born += litter; F.addXP(3 * litter);
    F.log(`母兔「${m.nm}」生了 ${litter} 隻小兔子！`, 'good'); emit({ k: 'birth', n: litter, id: m.id });
  }
  /* 繁殖 */
  const n = G.rabbits.length, cap = F.cap();
  const males = F.adults('m').filter(r => !r.sick).length;
  if (males && n < cap) {
    const sm = [1.3, 1, 0.9, 0.5][s] * (G.pelShort ? 0.25 : 1);
    for (const r of F.adults('f')) if (!r.preg && !r.nurse && !r.sick && r.mood > 40 && r.full > 45 && r.age < F.OLD && Math.random() < 0.26 * sm * (r.mood / 70)) r.preg = F.GESTATION;
  } else if (n >= cap && G.day % 3 === 0) F.log('兔籠住滿了，兔子不會再繁殖。可以加蓋兔籠、修好門，或賣出一些兔子。', '');
  /* 衛生 */
  G.clean = U.clamp(G.clean - (0.8 + n / 10 * 1.1) * (G.weather === '雨' ? 1.4 : 1), 0, 100);
  if (G.clean < 25 && G.day % 2 === 0) F.log('兔舍很髒了，愛乾淨的兔子很不開心，也容易生病。', 'bad');
  /* 擺設的魅力 */
  const types = new Set(G.decor.map(d => d.t));
  const appeal = Math.min(28, G.decor.reduce((a, d) => a + F.DEC[d.t].ap, 0) * 0.7);
  const broken = G.doors.filter(d => !d).length;
  /* 每日心情、疾病、禮物 */
  const sickN = G.rabbits.filter(r => r.sick).length;
  for (const r of G.rabbits) {
    const P = F.PERS[r.pers];
    const fav = P.likes.some(t => types.has(t)) ? 8 : 0;
    let target = 42 + appeal + fav + (G.clean - 50) * (r.pers === 'neat' ? 0.35 : 0.15) + (r.full > 50 ? 8 : -20) - (r.sick ? 18 : 0) - (n > cap ? 15 : 0) - broken * 6 + (F.affLv(r.aff) * 2);
    r.mood = U.clamp(r.mood * 0.65 + target * 0.35, 0, 100);
    if (r.sick) { r.sick++; if (G.med > 0) { G.med--; r.sick = 0; F.log(`用藥治好了「${r.nm}」。`, 'good'); } }
    else if (Math.random() < 0.004 + (G.clean < 40 ? 0.02 : 0) + (G.clean < 20 ? 0.03 : 0) + (n > cap ? 0.025 : 0) + (G.hayShort ? 0.03 : 0) + Math.min(0.06, 0.1 * sickN / Math.max(1, n))) { r.sick = 1; F.log(`「${r.nm}」生病了（${U.pick(['腸胃停滯', '感冒打噴嚏', '皮膚黴菌', '牙齒太長'])}），需要藥品。`, 'bad'); }
    r.aff = Math.max(0, r.aff - 0.4);  /* 久沒互動會慢慢生疏 */
    /* 禮物 */
    const gp = (r.aff >= 40 && r.mood >= 60 ? 0.12 : 0) + (r.pers === 'curious' ? 0.06 : 0) + (r.pers === 'tsun' && r.aff >= 60 ? 0.12 : 0);
    if (gp && Math.random() < gp && G.gifts.length < 12) { const v = Math.round((20 + r.aff * 1.1) * (r.pers === 'tsun' ? 1.6 : 1)); G.gifts.push({ id: G.nid++, rid: r.id, v, kind: U.pick(['🍀', '🥕', '🌸', '💎']) }); emit({ k: 'gift', rid: r.id }); }
  }
  /* 狗 */
  for (const d of G.dogs) {
    if (G.money >= F.DOG_COST) { G.money -= F.DOG_COST; G.stats.spent += F.DOG_COST; d.hungry = 0; d.hp = Math.min(100, d.hp + 20); }
    else { d.hungry++; d.hp = Math.max(5, d.hp - 10); if (d.hungry === 1) F.log(`沒錢買狗糧，「${d.nm}」餓肚子了。`, 'bad'); }
    d.care = {};
  }
  const gone = G.dogs.filter(d => d.hungry >= 4);
  for (const d of gone) { F.log(`「${d.nm}」長期挨餓，跑去別人家了……`, 'bad'); G.stats.dogLost++; emit({ k: 'dogGone', id: d.id }); }
  G.dogs = G.dogs.filter(d => !gone.includes(d));
  G.stats.maxRabbits = Math.max(G.stats.maxRabbits, G.rabbits.length);
  F.planDay(); F.newQuests();
  emit({ k: 'day' });
  F.checkAch();
};

/* ---------- 夜襲：野狼與 S 級狼人 ---------- */
F.dogPower = d => d.atk * (0.45 + d.hp / 180) * (1 + (d.lv - 1) * 0.1);
F.raid = function () {
  const d = G.day, S = !!G.wolfS;
  const n = S ? 1 : d < 12 ? 1 : U.clamp(1 + Math.floor(Math.random() * (1 + Math.min(3, d / 20 + G.rabbits.length / 40))), 1, 5);
  G.stats.attacks++; if (S) G.stats.sAttack++;
  const dogs = G.dogs.slice();
  const res = { n, S, dogs: [], taken: null, takenName: '', repelled: false, doors: [], bounty: 0 };
  let dp = 0; for (const g of dogs) dp += F.dogPower(g) * U.rand(0.75, 1.3);
  const wp = S ? U.rand(55, 85) : n * 12 * U.rand(0.8, 1.2) * (F.season() === 3 ? 1.15 : 1);
  res.repelled = dogs.length > 0 && dp >= wp;
  /* 狗的傷勢：一般狼只會受傷，不會死 */
  for (const g of dogs) {
    const dmg = Math.round(S ? U.rand(30, 60) : (wp / Math.max(1, dogs.length)) * U.rand(0.8, 1.6) + U.rand(2, 8));
    g.hp = Math.max(5, g.hp - dmg); res.dogs.push({ id: g.id, dmg, hp: g.hp }); G.stats.dogHurt++;
  }
  if (S && !res.repelled && dogs.length && Math.random() < 0.55) {
    const v = dogs.slice().sort((a, b) => a.hp - b.hp)[0];
    res.taken = v.id; res.takenName = v.nm; G.dogs = G.dogs.filter(x => x !== v); G.stats.dogLost++;
  }
  if (res.repelled) {
    G.stats.repel++;
    for (const g of G.dogs) { g.xp += S ? 5 : 1 + Math.floor(n / 2); g.wins++; while (g.xp >= g.lv * 3) { g.xp -= g.lv * 3; g.lv++; g.atk += 2; F.log(`「${g.nm}」累積實戰經驗，升到 ${g.lv} 級！`, 'good'); } }
    if (S) { res.bounty = 1500; G.money += 1500; G.stats.sWin++; }
    F.addXP(S ? 60 : 8);
  } else {
    /* 狼衝進兔舍：只破壞門、嚇壞兔子，不會抓走兔子 */
    const ok = G.doors.map((v, i) => (v ? i : -1)).filter(i => i >= 0);
    const k = Math.min(ok.length, S ? 2 : 1 + (n >= 3 ? 1 : 0));
    for (let i = 0; i < k; i++) { const j = ok.splice(Math.floor(Math.random() * ok.length), 1)[0]; G.doors[j] = 0; res.doors.push(j); G.stats.doorsBroken++; }
    for (const r of G.rabbits) r.mood = Math.max(0, r.mood - 15);
  }
  let m = S ? '🐺💀 S 級狼人襲擊！' : `🐺 ${n} 隻野狼夜襲！`;
  if (!dogs.length) m += '沒有看門狗……';
  else if (res.repelled) m += S ? `看門狗們聯手擊退了狼人！獲得賞金 $1,500！` : '看門狗英勇擊退了狼群！狗狗受了點傷。';
  else m += '狗狗擋不住，受傷了。';
  if (res.taken) m += `「${res.takenName}」被狼人叼走了……`;
  if (res.doors.length) m += `兔籠的門被抓壞了 ${res.doors.length} 扇，兔子嚇壞了（兔子都平安）。`;
  F.log(m, res.repelled && !res.taken ? 'good' : 'bad');
  emit({ k: 'raid', r: res });
  F.checkAch();
};
F.eagleScare = function () { const kits = G.rabbits.filter(r => r.age < 6); if (!kits.length || G.net) return; for (const r of kits) r.mood = Math.max(0, r.mood - 12); F.log('🦅 老鷹在天空盤旋，小兔子嚇得躲起來。裝防鳥網就不會了。', 'bad'); emit({ k: 'eagle' }); };

/* ---------- 互動 ---------- */
F.interact = function (r, act) {
  const A = F.ACTS[act], P = F.PERS[r.pers];
  if (!A) return { ok: false };
  if (r.care[act]) return { ok: false, msg: `今天已經${A.n}過了，明天再來吧` };
  if (A.cost && G.money < A.cost) return { ok: false, msg: '錢不夠' };
  if (A.cost) { G.money -= A.cost; G.stats.spent += A.cost; }
  r.care[act] = 1;
  let mul = P.m[act];
  if (r.pers === 'shy' && act === 'hug' && r.aff >= 40) mul = 2;
  if (r.pers === 'tsun' && r.aff >= 60) mul = 1.6;
  let react = 'happy', msg;
  if (mul < 0) { r.aff = Math.max(0, r.aff - 2); r.mood = Math.max(0, r.mood - 3); react = 'run'; msg = `${r.nm}害羞地跑走了……（好感度 40 以上才肯讓你抱）`; }
  else {
    const gain = A.aff * mul; r.aff = Math.min(100, r.aff + gain); r.mood = Math.min(100, r.mood + A.mood * Math.min(1.5, mul));
    react = mul >= 2 ? (r.pers === 'active' ? 'binky' : 'love') : mul < 0.8 ? 'meh' : 'happy';
    if (r.pers === 'tsun' && r.aff < 60) msg = `${r.nm}把頭撇過去：「哼，才、才不是喜歡呢！」（好感 +${gain.toFixed(1)}）`;
    else msg = mul >= 2 ? `${r.nm}超級開心！${act === 'play' ? '原地扭跳了一下！' : '眼睛都瞇起來了'}（好感 +${gain.toFixed(0)}）` : `${r.nm}很享受。（好感 +${gain.toFixed(1)}）`;
    if (act === 'snack' && r.sick) msg += ' 吃了點東西精神好多了。';
  }
  G.stats.pets++; F.qp(act === 'pet' ? 'pet' : act === 'snack' ? 'snack' : 'care'); F.qp('anycare'); F.addXP(1);
  const lv = F.affLv(r.aff);
  if (lv > (r.affLvSeen || 0)) { r.affLvSeen = lv; F.log(`💗 你和「${r.nm}」的關係變成「${F.AFF_LV[lv]}」了！`, 'big'); }
  F.checkAch();
  return { ok: true, react, msg };
};
F.dogInteract = function (d, act) {
  if (act === 'pet') { if (d.care.pet) return { ok: false, msg: '今天摸過了' }; d.care.pet = 1; d.aff = Math.min(100, d.aff + 5); F.qp('anycare'); return { ok: true, msg: `${d.nm}開心地搖尾巴！` }; }
  if (act === 'train') { if (d.care.train) return { ok: false, msg: '今天訓練過了，讓牠休息吧' }; if (d.hp < 40) return { ok: false, msg: '牠受傷了，先讓獸醫看看' }; if (!F.spend(300)) return { ok: false, msg: '錢不夠（$300）' }; d.care.train = 1; d.atk += 1; d.hp = Math.max(5, d.hp - 8); return { ok: true, msg: `${d.nm}完成防衛訓練，攻擊力 +1（現在 ${d.atk}）` }; }
  return { ok: false };
};
F.repairDoor = function () { const i = G.doors.findIndex(d => !d); if (i >= 0) { G.doors[i] = 1; F.log(`修好了第 ${i + 1} 座兔籠的門。`, 'good'); emit({ k: 'door', i }); } };
F.collectGift = function (id) { const g = G.gifts.find(x => x.id === id); if (!g) return 0; G.gifts = G.gifts.filter(x => x !== g); G.money += g.v; G.stats.gifts++; G.stats.giftMoney += g.v; F.qp('gift'); F.addXP(2); return g.v; };
F.rename = function (r, nm) { nm = String(nm || '').trim().slice(0, 8); if (nm) r.nm = nm; };

/* ---------- 擺設 ---------- */
F.freeSlot = () => { const used = new Set(G.decor.map(d => d.slot)); for (let i = 0; i < F.SLOTS; i++) if (!used.has(i)) return i; return -1; };
F.buyDecor = function (t) {
  const D = F.DEC[t]; if (!D) return 'no';
  if (G.level < D.lv) return 'lv';
  const s = F.freeSlot(); if (s < 0) return 'full';
  if (!F.spend(D.price)) return 'money';
  const it = { id: G.nid++, t, slot: s }; G.decor.push(it);
  F.log(`擺上了「${D.n}」！兔子們好奇地圍過來看。`, 'good'); F.addXP(10); emit({ k: 'decorAdd', id: it.id }); F.checkAch();
  return 'ok';
};
F.removeDecor = function (id) { const it = G.decor.find(d => d.id === id); if (!it) return; G.decor = G.decor.filter(d => d !== it); const back = Math.round(F.DEC[it.t].price * 0.5); G.money += back; F.log(`收起「${F.DEC[it.t].n}」，退回 $${back}。`, ''); emit({ k: 'decorDel', id }); };
F.useDecor = function (r, t) { if (!r) return; const fav = F.PERS[r.pers].likes.includes(t); r.mood = Math.min(100, r.mood + (fav ? 0.8 : 0.4)); return fav; };

/* ---------- 每日任務與等級 ---------- */
F.QPOOL = [
  { k: 'right', n: '答對 {g} 題行政法', g: [8, 12, 16] }, { k: 'hard', n: '答對 {g} 題 ⭐⭐⭐ 高難題', g: [1, 2, 3] }, { k: 'pet', n: '摸摸兔子 {g} 次', g: [3, 5, 8] },
  { k: 'snack', n: '餵兔子零食 {g} 次', g: [2, 3, 4] }, { k: 'care', n: '幫兔子梳毛／陪玩／抱抱 {g} 次', g: [3, 5, 7] }, { k: 'clean', n: '打掃兔舍 {g} 次', g: [1, 1, 1] },
  { k: 'gift', n: '收集兔子的禮物 {g} 個', g: [1, 2, 3] }, { k: 'review', n: '錯題複習答對 {g} 題', g: [3, 5, 8] }, { k: 'streak', n: '連續答對 {g} 題', g: [5, 8, 12] },
];
F.newQuests = function () {
  if (G.quests && G.quests.day === G.day) return;
  const pool = F.QPOOL.slice().sort(() => Math.random() - 0.5);
  const tier = G.level < 4 ? 0 : G.level < 9 ? 1 : 2;
  const list = [pool.find(q => q.k === 'right')].concat(pool.filter(q => q.k !== 'right').slice(0, 2)).map(q => ({ k: q.k, n: q.n.replace('{g}', q.g[tier]), goal: q.g[tier], prog: 0, claimed: 0 }));
  G.quests = { day: G.day, list };
};
F.qp = function (k, v) { if (!G.quests) return; for (const q of G.quests.list) if (q.k === k && !q.claimed) { q.prog = k === 'streak' ? Math.max(q.prog, v || 0) : Math.min(q.goal, q.prog + (v || 1)); if (q.prog >= q.goal && !q.noted) { q.noted = 1; emit({ k: 'questDone', q }); } } };
F.qReward = () => 150 + G.level * 40;
F.claimQuest = function (i) { const q = G.quests && G.quests.list[i]; if (!q || q.claimed || q.prog < q.goal) return 0; q.claimed = 1; const v = F.qReward(); G.money += v; F.addXP(40); F.log(`✅ 完成每日任務「${q.n}」，獎勵 $${v}！`, 'good'); return v; };
F.xpNeed = lv => Math.round(80 * Math.pow(lv, 1.35));
F.addXP = function (v) {
  G.xp += v;
  while (G.level < 30 && G.xp >= F.xpNeed(G.level)) {
    G.xp -= F.xpNeed(G.level); G.level++;
    const bonus = 200 * G.level; G.money += bonus;
    const un = F.DECOR.filter(d => d.lv === G.level).map(d => d.n);
    F.log(`🎉 農場升到 ${G.level} 級！獎勵 $${U.fmt(bonus)}${un.length ? `，解鎖新擺設：${un.join('、')}` : ''}`, 'big');
    emit({ k: 'levelup', lv: G.level });
  }
};

/* ---------- 其他動作 ---------- */
F.spend = function (c) { if (G.money < c) return false; G.money -= c; G.stats.spent += c; return true; };
F.buy = function (id) {
  const it = F.SHOP.find(x => x.id === id); if (!it) return 'no';
  if (it.can && !it.can()) return 'no';
  if (it.lv && G.level < it.lv) return 'lv';
  if (!F.spend(F.price(it))) return 'money';
  it.f(); if (id === 'fence') F.log(`圍籬升級為「${F.FENCE[G.fence].n}」。`, 'good');
  emit({ k: 'buy', id }); F.checkAch(); return 'ok';
};
F.cleanCost = () => 60 * G.hutch;
F.doClean = function () { if (G.clean >= 98) return 'full'; if (!F.spend(F.cleanCost())) return 'money'; G.clean = 100; F.qp('clean'); F.log('把兔舍打掃得乾乾淨淨，愛乾淨的兔子好開心。', 'good'); for (const r of G.rabbits) if (r.pers === 'neat') r.mood = Math.min(100, r.mood + 10); return 'ok'; };
F.sellPrice = r => (r.age < 4 ? 0 : Math.round((r.age < F.ADULT ? 180 : r.age > F.OLD ? 150 : 280) * (1 + F.rarity(r.coat) * 0.35) * (0.8 + r.mood / 250)));
F.sellOne = function (id) {
  const r = G.rabbits.find(q => q.id === id); if (!r) return 0;
  if (r.preg || r.nurse) return -1;
  const p = F.sellPrice(r); if (!p) return 0;
  G.rabbits = G.rabbits.filter(q => q !== r); G.money += p; G.stats.sold++; G.stats.soldMoney += p;
  F.log(`「${r.nm}」被一戶好人家領養了，得到 $${p}。`, ''); emit({ k: 'rabbitDel', id });
  return p;
};
F.summary = function () { const R = G.rabbits; return { total: R.length, m: R.filter(r => r.age >= F.ADULT && r.s === 'm').length, f: R.filter(r => r.age >= F.ADULT && r.s === 'f').length, kit: R.filter(r => r.age < F.ADULT).length, preg: R.filter(r => r.preg).length, sick: R.filter(r => r.sick).length, happy: R.filter(r => r.mood >= 70).length, mood: R.length ? R.reduce((a, r) => a + r.mood, 0) / R.length : 0 }; };
F.moodIc = m => (m >= 80 ? '😆' : m >= 60 ? '😊' : m >= 40 ? '🙂' : m >= 20 ? '😟' : '😢');

/* ---------- 成就 ---------- */
F.ACH = [
  { id: 'first', n: '第一份工作', d: '答對第 1 題', t: () => G.quiz.right >= 1 },
  { id: 'q50', n: '勤奮的打工仔', d: '累計答對 50 題', t: () => G.quiz.right >= 50 },
  { id: 'q200', n: '法條小達人', d: '累計答對 200 題', t: () => G.quiz.right >= 200 },
  { id: 'q500', n: '行政法專家', d: '累計答對 500 題', t: () => G.quiz.right >= 500 },
  { id: 's10', n: '連對 10 題', d: '一次連續答對 10 題', t: () => G.quiz.best >= 10 },
  { id: 's25', n: '心如明鏡', d: '一次連續答對 25 題', t: () => G.quiz.best >= 25 },
  { id: 'ch3', n: '漸入佳境', d: '解鎖 3 個章節', t: () => G.quiz.unlocked.length >= 3 },
  { id: 'chall', n: '全章節開放', d: '解鎖全部章節', t: () => window.CH && G.quiz.unlocked.length >= window.CH.length },
  { id: 'exam60', n: '模擬考及格', d: '模擬考達 60 分', t: () => G.quiz.exams.some(e => e.score >= 60) },
  { id: 'exam90', n: '金榜題名', d: '模擬考達 90 分', t: () => G.quiz.exams.some(e => e.score >= 90) },
  { id: 'r20', n: '兔丁興旺', d: '同時擁有 20 隻兔子', t: () => G.rabbits.length >= 20 },
  { id: 'r50', n: '兔子王國', d: '同時擁有 50 隻兔子', t: () => G.rabbits.length >= 50 },
  { id: 'alb8', n: '花色收藏家', d: '圖鑑收集 8 種花色', t: () => Object.keys(G.album).length >= 8 },
  { id: 'alb20', n: '兔子圖鑑大師', d: '圖鑑收集 20 種花色', t: () => Object.keys(G.album).length >= 20 },
  { id: 'friend', n: '第一位摯友', d: '和一隻兔子成為摯友（好感 80）', t: () => G.rabbits.some(r => r.aff >= 80) },
  { id: 'dec5', n: '佈置達人', d: '擺放 5 個擺設', t: () => G.decor.length >= 5 },
  { id: 'dec12', n: '夢幻兔子樂園', d: '擺放 12 個擺設', t: () => G.decor.length >= 12 },
  { id: 'dog', n: '忠犬守護', d: '雇用第一隻看門狗', t: () => G.dogs.length >= 1 },
  { id: 'repel', n: '擊退狼群', d: '成功擊退野狼 1 次', t: () => G.stats.repel >= 1 },
  { id: 'repel10', n: '銅牆鐵壁', d: '成功擊退野狼 10 次', t: () => G.stats.repel >= 10 },
  { id: 'swin', n: '狼人獵人', d: '擊退 S 級狼人', t: () => G.stats.sWin >= 1 },
  { id: 'lv10', n: '知名農場', d: '農場達到 10 級', t: () => G.level >= 10 },
  { id: 'rich', n: '小有積蓄', d: '存款達 $20,000', t: () => G.money >= 20000 },
  { id: 'year', n: '一週年', d: '經營滿 1 年', t: () => G.day >= F.YEAR_DAYS },
];
F.checkAch = function () { for (const a of F.ACH) if (!G.ach[a.id] && a.t()) { G.ach[a.id] = G.day + 1; F.log(`🏆 達成成就「${a.n}」：${a.d}`, 'big'); emit({ k: 'ach', a }); } };

/* ---------- 舊存檔升級（v1 → v2）：保留答題紀錄、金錢、兔子 ---------- */
F.migrate = function (d) {
  if (d.v >= 2) { const b = F.blank(); for (const k in b) if (d[k] === undefined) d[k] = b[k]; for (const k in b.stats) if (d.stats[k] === undefined) d.stats[k] = 0; return d; }
  const b = F.blank();
  const colMap = ['white', 'fawn', 'gray', 'choco', 'cream', 'black'];
  const o = Object.assign(b, { name: d.name, money: d.money, day: d.day, min: d.min, speed: d.speed ?? 1, hay: d.hay, pel: d.pel, med: d.med || 0, hutch: Math.min(F.MAX_HUTCH, d.hutch || 1), fence: d.fence || 0, net: d.net || 0, clean: d.clean ?? 80, nid: d.nid || 1000, log: d.log || [], quiz: d.quiz, ach: d.ach || {}, seenIntro: 1, seenV2: 0 });
  o.doors = Array(o.hutch).fill(1);
  o.rabbits = (d.rabbits || []).map(r => ({ id: r.id, s: r.s, age: r.age, hp: Math.max(30, r.hp), full: r.full, preg: r.preg || 0, nurse: r.nurse || 0, sick: r.sick ? 1 : 0, mood: 60, aff: 10, pers: U.pick(Object.keys(F.PERS)), coat: { c1: colMap[r.col] || 'brown', c2: 'white', pat: 'solid', br: 'std' }, nm: r.nm, care: {}, born: 0 }));
  o.dogs = (d.dogs || []).map((g, i) => ({ id: g.id, nm: g.nm, ci: i % 6, hp: Math.max(20, g.hp), atk: g.atk, lv: g.lv || 1, xp: g.xp || 0, hungry: 0, wins: g.wins || 0, aff: 10, care: {} }));
  for (const k in o.stats) if (d.stats && d.stats[k] !== undefined) o.stats[k] = d.stats[k];
  for (const r of o.rabbits) o.album[F.coatKey(r.coat)] = 1;
  o.level = 1 + Math.min(8, Math.floor((d.quiz ? d.quiz.right : 0) / 60));
  return o;
};

/* ---------- 存檔 ---------- */
F.KEY = 'rabbit_law_farm_v1';
F.save = function () { try { const s = JSON.stringify(G); const p = localStorage.getItem(F.KEY); if (p) localStorage.setItem(F.KEY + '_bak', p); localStorage.setItem(F.KEY, s); return true; } catch (e) { return false; } };
F.load = function () {
  for (const k of [F.KEY, F.KEY + '_bak']) {
    try { const d = JSON.parse(localStorage.getItem(k)); if (d && d.rabbits && d.quiz) { const m = F.migrate(d); for (const q of Object.keys(G)) delete G[q]; Object.assign(G, m); F.newQuests(); return true; } } catch (e) { /* 試下一份 */ }
  }
  return false;
};
F.peek = function () { try { return JSON.parse(localStorage.getItem(F.KEY)); } catch (e) { return null; } };
F.wipe = function () { try { localStorage.removeItem(F.KEY); localStorage.removeItem(F.KEY + '_bak'); } catch (e) { /* 略 */ } };
F.exportSave = () => 'RLF2:' + btoa(unescape(encodeURIComponent(JSON.stringify(G))));
F.importSave = function (s) {
  try { s = String(s).trim().replace(/^RLF2:/, ''); const d = JSON.parse(decodeURIComponent(escape(atob(s)))); if (!d.rabbits || !d.quiz) return false; const m = F.migrate(d); for (const q of Object.keys(G)) delete G[q]; Object.assign(G, m); F.save(); return true; } catch (e) { return false; }
};
})();

</script>
<script>
/* 答題工作系統：題目編號、章節解鎖、間隔複習（萊特納盒）、出題、計分與報酬、職稱、模擬考 */
(function () {
'use strict';
const Q = window.Q = {};
const CH = window.CH;
Q.ALL = [];
CH.forEach((c, ci) => c.qs.forEach((q, i) => Q.ALL.push({ id: `${c.id}-${i + 1}`, ch: c.id, ci, d: q[0], q: q[1], a: q[2], w: q[3], e: q[4], law: q[5] })));
Q.BY = Object.fromEntries(Q.ALL.map(q => [q.id, q]));
Q.PAY = [0, 50, 90, 150];
Q.DIFF = ['', '基礎', '進階', '高難'];
Q.UNLOCK = 0.6;    /* 本章答對過 60% 題目即開放下一章 */
Q.RANKS = [

/* ---------- 靜態場景：草地、圍籬、森林、山、花 ---------- */
MD.scenery = function (season, pen) {
  const B = new G3.Builder(), M = G3.M4, R = G3.RAW;
  const rnd = (() => { let s = 12345; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const T = (p, r, s) => M.trs(p, r || [0, 0, 0], s || [1, 1, 1]);
  const C = h => hex(h);
  /* 地面 */
  const grass = { p: [], n: [], ix: [] }, N = 60, S = 90;
  for (let i = 0; i <= N; i++) for (let k = 0; k <= N; k++) { const x = (k / N - 0.5) * S, z = (i / N - 0.5) * S; const d = Math.hypot(x, z); const y = d > 26 ? (d - 26) * 0.35 * (0.6 + 0.4 * Math.sin(x * 0.3) * Math.cos(z * 0.25)) : 0; grass.p.push(x, y, z); grass.n.push(0, 1, 0); }

  const gStart = B.p.length / 3;

  for (let v = gStart; v < B.p.length / 3; v++) {
    const x = B.p[v * 3], z = B.p[v * 3 + 2];
    const nz = Math.sin(x * 0.7) * Math.cos(z * 0.6) * 0.5 + Math.sin(x * 2.1 + z * 1.3) * 0.25;
    let c = [0.38 + nz * 0.06, 0.58 + nz * 0.07, 0.26 + nz * 0.04];
    const inPen = x > pen.x0 && x < pen.x1 && z > pen.z0 && z < pen.z1;
    if (inPen) c = [0.46 + nz * 0.04, 0.64 + nz * 0.05, 0.32];
    if (Math.abs(x - 0.4) < 0.9 + Math.sin(z) * 0.2 && z > pen.z1 && z < 14) c = [0.72, 0.6, 0.42];  /* 小徑 */
    B.c[v * 3] = c[0]; B.c[v * 3 + 1] = c[1]; B.c[v * 3 + 2] = c[2];

  /* 圍籬 */
  const post = C('#b88a58'), rail = C('#d4a670');
  const fenceLine = (x0, z0, x1, z1, gap) => { const L = Math.hypot(x1 - x0, z1 - z0), n2 = Math.round(L / 1.2), ang = Math.atan2(x1 - x0, z1 - z0); for (let i = 0; i <= n2; i++) { const f = i / n2, x = x0 + (x1 - x0) * f, z = z0 + (z1 - z0) * f; if (gap && Math.abs(x - gap) < 0.9) continue; B.add(R.box, T([x, 0.45, z], [0, 0, 0], [0.12, 0.9, 0.12]), post); B.add(R.box, T([x, 0.93, z], [0, Math.PI / 4, 0], [0.12, 0.08, 0.12]), post); } for (const y of [0.35, 0.7]) { const segs = gap ? [[x0, gap - 0.8], [gap + 0.8, x1]] : [[0, 1]]; if (!gap) B.add(R.box, T([(x0 + x1) / 2, y, (z0 + z1) / 2], [0, ang, 0], [0.06, 0.1, L]), rail); else for (const [a, b] of segs) B.add(R.box, T([(a + b) / 2, y, z0], [0, Math.PI / 2, 0], [0.06, 0.1, Math.abs(b - a)]), rail); } };
  fenceLine(pen.x0, pen.z0, pen.x1, pen.z0); fenceLine(pen.x0, pen.z1, pen.x1, pen.z1, 0.4); fenceLine(pen.x0, pen.z0, pen.x0, pen.z1); fenceLine(pen.x1, pen.z0, pen.x1, pen.z1);
  /* 樹 */
  const leaf = season === 2 ? ['#d8862a', '#c8582a', '#e8b03a'] : season === 3 ? ['#6a8a72', '#7a9a82', '#8aa890'] : season === 0 ? ['#5aa84a', '#7ac85a', '#f2a6c8'] : ['#3f8a3a', '#4a9a42', '#5aa84a'];
  const pine = season === 3 ? '#5a7a68' : '#2f6a42';
  for (let i = 0; i < 130; i++) {
    const a = rnd() * Math.PI * 2, r = 15 + rnd() * 16; const x = Math.cos(a) * r * 1.15, z = Math.sin(a) * r - 2;
    if (z > 12 && Math.abs(x) < 10) continue;
    const s = 0.8 + rnd() * 0.9;
    if (rnd() < 0.55) { B.add(R.cylLo, T([x, 0.5 * s, z], 0, [0.18 * s, 1 * s, 0.18 * s]), C('#6a4a30')); for (let k = 0; k < 3; k++) B.add(R.cone6, T([x, (1 + k * 0.7) * s, z], [0, rnd(), 0], [(1.2 - k * 0.3) * s, 1.4 * s, (1.2 - k * 0.3) * s]), C(pine), 0.12); if (season === 3) B.add(R.cone6, T([x, 2.95 * s, z], 0, [0.4 * s, 0.4 * s, 0.4 * s]), C('#ffffff')); }
    else { B.add(R.cylLo, T([x, 0.7 * s, z], 0, [0.16 * s, 1.4 * s, 0.16 * s]), C('#7a5636')); for (let k = 0; k < 4; k++) B.add(R.sphereLo, T([x + (rnd() - 0.5) * 0.9 * s, (1.8 + rnd() * 0.6) * s, z + (rnd() - 0.5) * 0.9 * s], 0, [0.75 * s, 0.65 * s, 0.75 * s]), C(leaf[Math.floor(rnd() * leaf.length)]), 0.12); }

/* ---------- 光線與天空 ---------- */
const K = [[0, '#0e1632', '#24304e', 0], [4.5, '#1a2244', '#3a3c66', 0.05], [5.8, '#f0a070', '#fbd0a0', 0.5], [7.5, '#9ccbea', '#dceefa', 1], [16.5, '#9ccbea', '#e2f2fa', 1], [18.2, '#f08a5c', '#f8c08a', 0.55], [19.4, '#3a3a6a', '#6a5478', 0.1], [20.5, '#0e1632', '#24304e', 0], [24, '#0e1632', '#24304e', 0]];
const hx = G3.hex;

  }
  /* 選中的兔子：名牌 */
  if (W3.sel && W3.sel.type === 'rabbit') { const a = W3.rab.get(W3.sel.id), r = G.rabbits.find(q => q.id === W3.sel.id); if (a && r) { const s = G3.project([a.x, a.y + (a.kit ? 0.55 : 0.9), a.z]); if (s) { const t = `${r.nm} ${F.PERS[r.pers].ic}`; c.font = '700 14px "Huninn","Noto Sans TC",sans-serif'; const w = c.measureText(t).width + 18; c.fillStyle = 'rgba(255,253,248,0.95)'; rr(c, s[0] - w / 2, s[1] - 28, w, 24, 12); c.fill(); c.fillStyle = '#2b2622'; c.fillText(t, s[0], s[1] - 15); c.fillStyle = 'rgba(255,253,248,0.95)'; c.beginPath(); c.moveTo(s[0] - 6, s[1] - 4); c.lineTo(s[0] + 6, s[1] - 4); c.lineTo(s[0], s[1] + 3); c.fill(); } } }
  /* 狗的血條 */
  for (const [id, a] of W3.dogs) { const d = G.dogs.find(q => q.id === id); if (!d || (d.hp >= 99 && !W3.raidAnim)) continue; const s = G3.project([a.x, 1.15, a.z]); if (!s) continue; c.fillStyle = 'rgba(0,0,0,.45)'; rr(c, s[0] - 22, s[1], 44, 7, 3); c.fill(); c.fillStyle = d.hp < 30 ? '#e8402a' : d.hp < 60 ? '#e8b03a' : '#5ac84a'; rr(c, s[0] - 21, s[1] + 1, 42 * d.hp / 100, 5, 2); c.fill(); }
  /* 文字特效 */
  for (const f of W3.fx) {
    f.t += dt; if (f.t < 0) continue;
    const k = f.t / f.dur;
    if (f.k === 'txt') { const s = G3.project([f.p[0], f.p[1] + k * 0.7, f.p[2]]); if (!s) continue; c.globalAlpha = Math.max(0, 1 - k * k); c.font = f.col ? '900 20px "Huninn",sans-serif' : `${18 + (1 - k) * 6}px sans-serif`; if (f.col) { c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(f.txt, s[0], s[1]); c.fillStyle = f.col; } c.fillText(f.txt, s[0], s[1]); c.globalAlpha = 1; }
    else if (f.k === 'puff') { const s = G3.project(f.p); if (!s) continue; c.globalAlpha = Math.max(0, 0.7 * (1 - k)); c.fillStyle = '#efe6d6'; c.beginPath(); c.arc(s[0], s[1], f.r * (0.6 + k * 1.4), 0, 6.3); c.fill(); c.globalAlpha = 1; }
  }
  W3.fx = W3.fx.filter(f => f.t < f.dur);
  /* 天氣 */
  if (G.weather === '雨' || G.weather === '颱風') { c.strokeStyle = 'rgba(210,225,255,0.45)'; c.lineWidth = 1.2; c.beginPath(); const n = G.weather === '颱風' ? 140 : 80, sl = G.weather === '颱風' ? 10 : 3; for (let i = 0; i < n; i++) { const x = (i * 53.7 + T * (G.weather === '颱風' ? 400 : 120)) % (W + 40) - 20, y = (i * 97.1 + T * 520) % H; c.moveTo(x, y); c.lineTo(x - sl, y + 14); } c.stroke(); }
  if (G.weather === '寒流' || (F.season() === 3 && G.weather === '陰')) { c.fillStyle = 'rgba(255,255,255,0.85)'; for (let i = 0; i < 60; i++) { const x = (i * 71.3 + Math.sin(T + i) * 20 + T * 15) % W, y = (i * 43.9 + T * 40) % H; c.beginPath(); c.arc(x, y, 1.6, 0, 6.3); c.fill(); } }
  if (G.weather === '晴' && env.day > 0.6 && F.season() === 0) { c.fillStyle = 'rgba(255,190,215,0.8)'; for (let i = 0; i < 14; i++) { const x = (i * 91.3 + T * 22) % W, y = (i * 57.1 + T * 30 + Math.sin(T + i) * 10) % H; c.beginPath(); c.ellipse(x, y, 3.5, 2, i, 0, 6.3); c.fill(); } }
  /* 夜襲時的暗角 */
  if (W3.raidAnim) { const g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75); g.addColorStop(0, 'rgba(80,0,0,0)'); g.addColorStop(1, `rgba(90,0,10,${0.35 + Math.sin(T * 4) * 0.08})`); c.fillStyle = g; c.fillRect(0, 0, W, H); }
  /* 橫幅 */
  if (W3.ban) { const b = W3.ban; b.t += dt; const a = Math.min(1, (b.dur - b.t) * 2, b.t * 4); if (b.t > b.dur) W3.ban = null; else { c.globalAlpha = Math.max(0, a); c.font = '900 18px "Huninn","Noto Sans TC",sans-serif'; const w = Math.min(W - 24, c.measureText(b.m).width + 40); c.fillStyle = b.col; rr(c, W / 2 - w / 2, H * 0.3 - 22, w, 44, 16); c.fill(); c.fillStyle = '#fff'; c.fillText(b.m, W / 2, H * 0.3); c.globalAlpha = 1; } }
};
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ---------- 點選與鏡頭操作 ---------- */
W3.pick = function (sx, sy) {
  for (const g of W3.giftHit || []) if (Math.hypot(g.x - sx, g.y - sy) < 30) return { type: 'gift', id: g.id };
  let best = null, bd = 46;
  for (const [id, a] of W3.rab) { if (a.hidden) continue; const s = G3.project([a.x, a.y + (a.kit ? 0.25 : 0.38), a.z]); if (!s) continue; const d = Math.hypot(s[0] - sx, s[1] - sy) - (a.kit ? -6 : 0); if (d < bd) { bd = d; best = { type: 'rabbit', id }; } }
  for (const [id, a] of W3.dogs) { const s = G3.project([a.x, 0.55, a.z]); if (!s) continue; const d = Math.hypot(s[0] - sx, s[1] - sy); if (d < bd) { bd = d; best = { type: 'dog', id }; } }
  if (best) return best;
  W3.huts.forEach((h, i) => { if (G.doors[i]) return; const s = G3.project([HX(i) + 0.42, 1.0, HUTCH_Z + 0.6]); if (s && Math.hypot(s[0] - sx, s[1] - sy) < 55) best = { type: 'door', id: i }; });
  if (best) return best;
  for (const [id, d] of W3.dec) { const s = G3.project([d.x, 0.4, d.z]); if (s && Math.hypot(s[0] - sx, s[1] - sy) < 48) return { type: 'decor', id }; }
  return null;
};
W3.bindInput = function () {
  const el = W3.ov; const P = new Map(); let drag = 0, pinch0 = 0, dist0 = 0, sx = 0, sy = 0, t0 = 0;
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]); if (P.size === 1) { drag = 0; sx = e.clientX; sy = e.clientY; t0 = performance.now(); } if (P.size === 2) { const [a, b] = [...P.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = W3.cam.dist; } });
  el.addEventListener('pointermove', e => {
    if (!P.has(e.pointerId)) return; const prev = P.get(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]);
    if (P.size === 2) { const [a, b] = [...P.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0) W3.cam.dist = clamp(dist0 * pinch0 / d, 7, 30); drag = 9; return; }
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) drag = 1;
    if (drag) { W3.cam.yaw -= dx * 0.008; W3.cam.pitch = clamp(W3.cam.pitch + dy * 0.005, 0.35, 1.3); }
  });
  const up = e => { const was = P.has(e.pointerId); P.delete(e.pointerId); if (!was) return; if (P.size === 0) { if (!drag && performance.now() - t0 < 500) { const r = el.getBoundingClientRect(); const hit = W3.pick(e.clientX - r.left, e.clientY - r.top); if (W3.onPick) W3.onPick(hit); } pinch0 = 0; } };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', e => { e.preventDefault(); W3.cam.dist = clamp(W3.cam.dist * (1 + Math.sign(e.deltaY) * 0.1), 7, 30); }, { passive: false });
};
})();

<script>
/* 介面 v2：標題、主迴圈、頂部狀態、底部面板（工作、農場、兔子、商店、筆記、錯題、成就）、兔子／狗／擺設卡片、

(function () {

let toastT;

const meter = (p, col) => `<div class="meter"><i style="width:${U.clamp(p * 100, 0, 100)}%;${col ? 'background:' + col : ''}"></i></div>`;
const hearts = a => { const l = F.affLv(a); let s = ''; for (let i = 0; i < 5; i++) s += i <= l - 1 || (i === 0 && a >= 10) ? '💗' : '🤍'; return s; };

function viewH() { const b = $('bottom'); return b.hidden ? H : Math.max(200, Math.round(b.getBoundingClientRect().top + 16)); }
function modal(html) { $('mbox').innerHTML = html; $('modal').hidden = false; }
$('modal').onclick = e => { if (e.target === $('modal') || e.target.dataset.close) $('modal').hidden = true; };

/* ---------- 標題 ---------- */
function titleScreen() {

  if ($('tCont')) $('tCont').onclick = () => { if (F.load()) start(); else toast('讀取失敗'); };

  modal(`<h2>🐰 歡迎來到${esc(G.name)}</h2>
  <p>你是兔子農場的主人，同時在法律事務所打工。<b>答對行政法考題</b>就能領工錢，題目越難（⭐⭐⭐）報酬越高。</p>

  <p>工作從<b>第一章</b>開始：本章答對過 60% 的題目就開放下一章。</p>
  <div class="acts"><button class="btn" data-close="1">開始！</button></div>`);
  G.seenIntro = 1; G.seenV2 = 1;
}
function introV2() {
  modal(`<h2>✨ 農場大改版！</h2><p>你的答題紀錄、金錢和兔子都保留下來了。</p>
  <p>・全新 3D 農場，兔子毛茸茸的會跳、會理毛、會翻肚睡覺<br>・每隻兔子都有<b>個性、心情、好感度</b>，點兔子就能互動<br>・商店新增 16 種<b>擺設</b>，兔子會開心地使用<br>・看門狗住在<b>庭院</b>，夜裡會和狼打鬥；<b>兔子不會再被抓走</b><br>・每日任務、農場等級、兔子圖鑑、稀有花色<br>・「🏆 成就」頁可以<b>匯出存檔</b>備份</p>

/* ---------- 速度 ---------- */
function setSpeed(s) { G.speed = s; document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('on', +b.dataset.s === s)); }
$('speed').onclick = e => { const b = e.target.closest('button'); if (b) { setSpeed(+b.dataset.s); toast(['⏸ 農場時間暫停', '▶ 正常速度', '⏩ 兩倍速度'][+b.dataset.s]); } };

/* ---------- 主迴圈 ---------- */
let last = performance.now(), acc = 0, hudT = 0, saveT = 0, curVH = 0;
function loop(now) {
  const dt = Math.min(0.06, (now - last) / 1000); last = now; UI.t += dt;
  if (G.rabbits && $('title').hidden) {
    if (!F.hold) { acc += dt * F.MIN_PER_SEC * (G.speed || 0); const n = Math.floor(acc); acc -= n; if (n) F.tick(Math.min(n, 120)); }
    events();
    hudT -= dt; if (hudT <= 0) { hudT = 0.3; hud(); }
    saveT += dt; if (saveT > 20) { saveT = 0; F.save(); }

    if (vh !== curVH) { curVH = vh; $('cv').style.height = $('ov').style.height = vh + 'px'; }
    if (W3.ok) W3.frame(dt, UI.t, W, vh);

}
function events() {
  for (const e of F.ev.splice(0)) {

    else if (e.k === 'birth') { toast(`🐣 生了 ${e.n} 隻小兔子！`); SFX.love(); }
    else if (e.k === 'alert') toast(e.m);
    else if (e.k === 'ach') { SFX.up(); toast(`🏆 ${e.a.n}`); }
    else if (e.k === 'levelup') { SFX.up(); toast(`🎉 農場升到 ${e.lv} 級！`); }
    else if (e.k === 'questDone') { SFX.pop(); toast(`📋 任務完成：${e.q.n}（去領獎勵）`); }
    else if (e.k === 'gift') { /* 世界裡會出現禮物圖示 */ }
    else if (e.k === 'day') { F.save(); if (!UI.quiz && UI.tab !== 'note') render(); }
  }
}

/* ---------- 頂部狀態 ---------- */
const WX = { 晴: '☀️ 晴', 陰: '☁️ 陰', 雨: '🌧️ 雨', 寒流: '🥶 寒流', 颱風: '🌀 颱風' };

  $('cWx').textContent = WX[G.weather] || G.weather;

  const qn = G.quests ? G.quests.list.filter(q => q.prog >= q.goal && !q.claimed).length : 0; $('fDot').hidden = !(qn || G.gifts.length || G.doors.some(d => !d)); $('fDot').textContent = qn + G.gifts.length || '!';
  if (UI.quiz && UI.quiz.mode === 'exam') { const el = $('exTimer'); if (el) { const left = Math.max(0, UI.quiz.end - Date.now()); el.textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}`; if (!left && !UI.quiz.done) finishExam(); } }
}

/* ---------- 底部面板 ---------- */
$('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (UI.quiz && !confirmLeave()) return; UI.quiz = null; UI.tab = b.dataset.t; UI.min = false; render(); };

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === UI.tab && !UI.quiz));
  $('bottom').classList.toggle('quiz', !!UI.quiz); $('bottom').classList.toggle('min', UI.min);
  const sh = $('sheet'); const keep = sh.scrollTop;
  sh.innerHTML = UI.quiz ? quizView() : PANEL[UI.tab]();

};

/* ---------- 答題 ---------- */
function startWork(cid) { closeCard(); UI.quiz = { mode: 'work', ch: cid, n: 0, right: 0, earn: 0 }; nextQ(); }
function startReview() { const L = Q.wrongList(); if (!L.length) return toast('沒有錯題'); closeCard(); UI.quiz = { mode: 'review', list: L.map(q => q.id).sort(() => Math.random() - 0.5), n: 0, right: 0, earn: 0 }; nextQ(); }
function startExam() { closeCard(); const list = Q.makeExam(20); UI.quiz = { mode: 'exam', list: list.map(q => q.id), i: 0, picks: [], pres: list.map(q => Q.present(q)), end: Date.now() + 30 * 60000, n: list.length }; render(); }
function nextQ() {
  const z = UI.quiz;
  if (z.mode === 'work') z.cur = Q.present(Q.pick(Q.chQs(z.ch)));
  else if (z.mode === 'review') { const id = z.list.shift(); if (!id) { const m = `錯題複習完成！答對 ${z.right}／${z.n} 題，收入 $${U.fmt(z.earn)}`; UI.quiz = null; UI.tab = 'wrong'; render(); toast(m); return; } z.cur = Q.present(Q.BY[id]); }
  z.ans = null; render();
}
function quizView() {
  const z = UI.quiz;
  if (z.mode === 'exam') return examView();
  const { q, opts } = z.cur, c = CH[q.ci];
  let h = `<div class="qhead"><span class="tag ${z.mode === 'review' ? 'r' : 'g'}">${z.mode === 'review' ? '📕 錯題複習' : '💼 ' + esc(c.n)}</span><span class="tag y">${stars(q.d)} ${Q.DIFF[q.d]}</span><span class="tag">💰 $${Q.payFor(q, z.mode)}</span><span class="tag y">🔥 ${G.quiz.streak}</span><span style="flex:1"></span><small style="color:var(--mute)">本次 ${z.right}/${z.n}・$${U.fmt(z.earn)}</small></div>`;
  h += `<div class="qtext">${esc(q.q)}</div>`;
  opts.forEach((o, i) => { const cls = z.ans != null ? (o.ok ? 'ok' : i === z.ans ? 'no' : '') : ''; h += `<button class="opt ${cls}" data-opt="${i}" ${z.ans != null ? 'disabled' : ''}><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`; });
  if (z.ans != null) {
    const ok = opts[z.ans].ok;
    h += `<div class="exp"><b class="v" style="color:${ok ? 'var(--ok)' : 'var(--red)'}">${ok ? `✔ 答對了！＋$${z.lastPay}` : `✘ 答錯了，正確答案是 ${'ABCD'[opts.findIndex(o => o.ok)]}`}</b><br><span class="law">${esc(q.law)}</span>${esc(q.e)}</div>`;
    if (z.unlocked) h += `<div class="exp" style="background:#eaf5e2;border-color:#b8dca0">🎉 開放新章節「${esc(z.unlocked.n)}」！</div>`;
    h += `<div class="qfoot"><button class="btn alt" data-quit="1">結束工作</button><button class="btn" data-next="1">下一題 ➜</button></div>`;
  } else h += `<div class="qfoot"><button class="btn alt s" data-quit="1">結束工作</button><button class="btn alt s" data-peek="${q.ch}">📖 偷看筆記</button></div>`;
  return h;
}
function answer(i) {
  const z = UI.quiz; if (z.ans != null) return;
  const { q, opts } = z.cur, ok = opts[i].ok;
  const r = Q.answer(q, ok, z.mode);
  z.ans = i; z.n++; z.lastPay = r.pay; z.unlocked = r.unlocked;
  if (ok) { z.right++; z.earn += r.pay; SFX.ok(); setTimeout(SFX.coin, 150); F.qp('right'); if (q.d === 3) F.qp('hard'); if (z.mode === 'review') F.qp('review'); F.qp('streak', G.quiz.streak); F.addXP(q.d * 2 + 1); coinFx(`+$${r.pay}`); }
  else SFX.no();
  if (r.unlocked) { SFX.up(); F.log(`開放新的工作章節「${r.unlocked.n}」！`, 'big'); }
  F.checkAch(); F.save(); render(); hud();
}
function coinFx(t) { const el = document.createElement('div'); el.className = 'coin'; el.textContent = t; el.style.top = Math.max(90, viewH() * 0.4) + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 1400); }
function examView() {
  const z = UI.quiz;
  if (z.done) return examResult();
  const p = z.pres[z.i];
  let h = `<div class="qhead"><span class="tag r">📝 模擬考</span><span class="tag">第 ${z.i + 1}／${z.n} 題</span><span class="tag y">${stars(p.q.d)}</span><span style="flex:1"></span>⏱ <b class="timer" id="exTimer"></b></div><div class="qtext">${esc(p.q.q)}</div>`;
  p.opts.forEach((o, i) => (h += `<button class="opt ${z.picks[z.i] === i ? 'pick' : ''}" data-xopt="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o.t)}</span></button>`));
  h += `<div class="qfoot"><button class="btn alt s" data-xprev="1" ${z.i ? '' : 'disabled'}>⬅ 上一題</button><span class="desc">已作答 ${z.picks.filter(x => x != null).length}/${z.n}</span>${z.i < z.n - 1 ? '<button class="btn s" data-xnext="1">下一題 ➜</button>' : '<button class="btn red s" data-xsubmit="1">交卷</button>'}</div>`;
  return h;
}
function finishExam() {
  const z = UI.quiz; if (z.done) return;
  let right = 0;
  z.pres.forEach((p, i) => { const ok = z.picks[i] != null && p.opts[z.picks[i]].ok; if (ok) right++; Q.answer(p.q, ok, 'exam'); });
  const score = Math.round(right / z.n * 100), pay = Q.examPay(score, z.n);
  G.money += pay; G.quiz.earned += pay; G.quiz.exams.push({ day: G.day, score, n: z.n });
  z.done = { right, score, pay };
  F.qp('right', right); F.addXP(right * 3);
  F.log(`模擬考 ${score} 分（${right}/${z.n}），獲得獎金 $${U.fmt(pay)}。`, score >= 60 ? 'big' : 'bad');
  if (score >= 60) SFX.up(); else SFX.no();
  coinFx(`+$${pay}`); F.checkAch(); F.save(); render();
}
function examResult() {
  const z = UI.quiz, d = z.done;
  let h = `<div style="text-align:center"><div class="bigscore" style="color:${d.score >= 60 ? 'var(--ok)' : 'var(--red)'}">${d.score} 分</div><div class="desc">答對 ${d.right}／${z.n} 題・${d.score >= 60 ? '及格！' : '再加油！'}獎金 $${U.fmt(d.pay)}</div></div>`;
  z.pres.forEach((p, i) => {
    const pk = z.picks[i], ok = pk != null && p.opts[pk].ok, ci = p.opts.findIndex(o => o.ok);
    h += `<div class="card"><div class="qhead"><span class="tag ${ok ? 'g' : 'r'}">${ok ? '✔' : '✘'} 第 ${i + 1} 題</span><span class="tag">${esc(CH[p.q.ci].n)}</span></div><div style="font-weight:700;line-height:1.55">${esc(p.q.q)}</div>
    ${!ok ? `<div class="desc" style="color:var(--red)">你的答案：${pk == null ? '未作答' : esc(p.opts[pk].t)}</div>` : ''}<div class="desc" style="color:var(--ok)">✔ ${esc(p.opts[ci].t)}</div><div class="desc"><span class="law">${esc(p.q.law)}</span>${esc(p.q.e)}</div></div>`;
  });
  return h + '<div class="acts"><button class="btn" data-quit="1">回到工作清單</button></div>';
}

/* ---------- 匯出匯入 ---------- */
function exportBox() { const s = F.exportSave(); modal(`<h2>📤 匯出存檔</h2><p>把下面這串文字整段複製起來（貼到記事本或傳給自己），換手機或資料被清掉時可以還原。</p><textarea id="exT" readonly style="width:100%;height:120px;font-size:11px">${esc(s)}</textarea><div class="acts"><button class="btn" id="exC">📋 複製</button><button class="btn alt" data-close="1">關閉</button></div>`); $('exC').onclick = () => { const t = $('exT'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('已複製'), () => { document.execCommand('copy'); toast('已複製'); }); } catch (e) { document.execCommand('copy'); toast('已複製'); } }; }
function importBox() { modal(`<h2>📥 匯入存檔</h2><p>貼上之前匯出的文字（RLF2: 開頭）。會覆蓋目前的農場。</p><textarea id="imT" style="width:100%;height:120px;font-size:11px"></textarea><div class="acts"><button class="btn red" id="imG">匯入</button><button class="btn alt" data-close="1">取消</button></div>`); $('imG').onclick = () => { if (F.importSave($('imT').value)) { $('modal').hidden = true; toast('匯入成功！'); start(); } else toast('格式不對，請確認有完整複製'); }; }

/* ---------- 點擊 ---------- */
$('sheet').onclick = e => {
  const b = e.target.closest('button,[data-ch],[data-rab],[data-dog]'); if (!b) return;
  const d = b.dataset;
  if (d.ch) { if (Q.unlocked(d.ch)) startWork(d.ch); return; }
  if (d.rab) { UI.card = { type: 'rabbit', id: +d.rab }; W3.sel = UI.card; UI.min = true; render(); renderCard(); return; }
  if (d.dog) { UI.card = { type: 'dog', id: +d.dog }; W3.sel = UI.card; UI.min = true; render(); renderCard(); return; }
  if (d.opt) return answer(+d.opt);
  if (d.next) return nextQ();
  if (d.quit) { const z = UI.quiz; if (z && z.mode !== 'exam' && z.n) toast(`這次工作答對 ${z.right}/${z.n} 題，賺了 $${U.fmt(z.earn)}`); UI.quiz = null; UI.tab = z && z.mode === 'review' ? 'wrong' : 'work'; render(); return; }
  if (d.peek) { const c = CH.find(x => x.id === d.peek); modal(`<h2>📖 ${esc(c.n)}</h2>${c.notes.map(n => `<div class="note">${esc(n)}</div>`).join('')}<div class="acts"><button class="btn" data-close="1">回去答題</button></div>`); return; }
  if (d.exam) return startExam();
  if (d.review) return startReview();
  if (d.xopt) { UI.quiz.picks[UI.quiz.i] = +d.xopt; SFX.coin(); if (UI.quiz.i < UI.quiz.n - 1) setTimeout(() => { UI.quiz.i++; render(); }, 180); render(); return; }
  if (d.xprev) { UI.quiz.i--; render(); return; }
  if (d.xnext) { UI.quiz.i++; render(); return; }
  if (d.xsubmit) { const miss = UI.quiz.picks.filter(x => x != null).length < UI.quiz.n; if (miss && !(UI.subArm && Date.now() - UI.subArm < 3000)) { UI.subArm = Date.now(); toast('還有題目沒作答，再按一次交卷'); return; } finishExam(); return; }
  if (d.claim) { const v = F.claimQuest(+d.claim); if (v) { SFX.coin(); toast(`任務獎勵 +$${v}`); } render(); hud(); return; }
  if (d.gifts) { let s = 0; for (const g of G.gifts.slice()) s += F.collectGift(g.id); SFX.coin(); toast(`🎁 收下禮物 +$${s}`); render(); hud(); return; }
  if (d.buy) { const r = F.buy(d.buy); toast(r === 'ok' ? '購買成功！' : r === 'money' ? '錢不夠，去工作答題吧' : r === 'lv' ? '農場等級不夠' : '目前無法購買'); if (r === 'ok') SFX.coin(); render(); hud(); return; }
  if (d.decor) { const r = F.buyDecor(d.decor); toast(r === 'ok' ? '擺好了！看兔子們圍過來 💗' : r === 'money' ? '錢不夠，去工作答題吧' : r === 'full' ? '擺設位置滿了，可以先收起一些' : r === 'lv' ? '農場等級不夠' : '無法購買'); if (r === 'ok') { SFX.love(); UI.min = true; } render(); hud(); return; }
  if (d.cat) { UI.shopCat = d.cat; if (d.go) UI.tab = d.go; render(); return; }
  if (d.clean) { const r = F.doClean(); toast(r === 'ok' ? '🧹 打掃完成' : r === 'money' ? '錢不夠' : '已經很乾淨了'); render(); return; }
  if (d.repair) { const r = F.buy('repair'); toast(r === 'ok' ? '🔨 修好了' : '錢不夠'); render(); return; }
  if (d.go) { UI.tab = d.go; render(); return; }
  if (d.bsort) { UI.bSort = d.bsort; render(); return; }
  if (d.album) { const keys = Object.keys(G.album); modal(`<h2>📔 兔子圖鑑 ${keys.length} 種</h2>${keys.map(k => { const [br, pat, c1] = k.split('-'); const c = { br, pat, c1 }; return `<div class="kv"><span>${F.rarity(c) >= 3 ? '✨' : F.rarity(c) >= 1 ? '⭐' : '・'} ${esc(F.coatName(c))}</span><b>第 ${G.album[k]} 天</b></div>`; }).join('')}<p class="desc" style="margin-top:8px">小兔子會遺傳爸媽的毛色，也有機率出現突變的稀有花色。稀有兔子送養價格更高。</p><div class="acts"><button class="btn" data-close="1">關閉</button></div>`); return; }
  if (d.note) { UI.noteCh = d.note; render(); return; }
  if (d.q != null) { G.quality = +d.q; render(); toast('畫質已調整'); return; }
  if (d.save) { toast(F.save() ? '💾 已存檔' : '存檔失敗'); return; }
  if (d.export) return exportBox();
  if (d.import) return importBox();
  if (d.intro) return intro();
  if (d.title) { F.save(); $('top').hidden = true; $('bottom').hidden = true; closeCard(); titleScreen(); return; }
};
addEventListener('keydown', e => {
  const z = UI.quiz; if (!z) return;
  const k = e.key.toUpperCase(), idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'ABCD'.indexOf(k);
  if (z.mode === 'exam') { if (idx >= 0 && !z.done) { z.picks[z.i] = idx; render(); } return; }
  if (idx >= 0 && z.ans == null) answer(idx); else if (e.key === 'Enter' && z.ans != null) nextQ();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.rabbits) F.save(); });
addEventListener('pagehide', () => { if (G.rabbits) F.save(); });

titleScreen(); requestAnimationFrame(loop);
})();

</script>
</body>
